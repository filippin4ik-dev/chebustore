name: chebustore

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chebustore
      POSTGRES_USER: chebu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chebu -d chebustore"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://chebu:${POSTGRES_PASSWORD}@db:5432/chebustore?schema=public
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-chebustore.ru}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [edge]

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
